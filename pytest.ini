[pytest]
# Scope the default `pytest` / `pytest .` invocation to the actual backend
# test suite only. Without this, pytest's default *_test.py / test_*.py
# discovery also picks up citizen-app/e2e_test.py, which is a standalone
# Playwright browser script (not a unit/integration test module) that
# requires the `playwright` package and two running local servers. It must
# be run explicitly and separately — see citizen-app/README.md.
testpaths = tests

# Defensive: even if someone runs `pytest .` or `pytest citizen-app`
# explicitly (bypassing testpaths), never recurse into these directories.
norecursedirs = .venv citizen-app node_modules .git .pytest_cache
