version: '3.8'

services:
  database_dev:
    image: postgis/postgis:15-3.3-alpine
    container_name: jalraksha_db_dev
    environment:
      POSTGRES_DB: jalraksha_db
      POSTGRES_USER: jalraksha_user
      POSTGRES_PASSWORD: jalraksha_dev_password
    ports:
      - "5432:5432"

  redis_dev:
    image: redis:7-alpine
    container_name: jalraksha_redis_dev
    ports:
      - "6379:6379"
